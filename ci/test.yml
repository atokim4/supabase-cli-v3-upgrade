# Copy to .github/workflows/test.yml to run it on GitHub.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Committed bundles match the source
        run: git diff --exit-code -- action/index.mjs skills/supabase-cli-v3-upgrade/scripts/v3check.mjs

  action-on-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: v3
        uses: ./
        with:
          path: examples/sample-app
          fail-on: none
      - name: The sample app has errors and SARIF was written
        run: |
          test "${{ steps.v3.outputs.errors-count }}" -gt 0
          test -s "${{ steps.v3.outputs.sarif-file }}"
